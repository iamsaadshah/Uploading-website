
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile Card</title>

  <link rel="stylesheet" href="style.css">

  <!-- Font Awesome -->
  <script
    src="https://kit.fontawesome.com/c486792074.js"
    crossorigin="anonymous">
  </script>
</head>

<body>

  <main>

    <div class="container">

      <!-- Upper profile section -->
      <div class="upper">

        <!-- IMPROVEMENT: Added meaningful alt text -->
        <img src="OIP.jpg" alt="Coding Lab profile picture">

      </div>

      <!-- Lower profile section -->
      <div class="lower">

        <h2 class="profile-title">Coding Lab</h2>

        <p class="slim-text">Youtuber & Blogger</p>

        <!-- Social media icons -->
        <div class="icons">

          <!-- IMPROVEMENT: Icons are now clickable links -->
          <a href="#" aria-label="Instagram">
            <i class="fa-brands fa-instagram"></i>
          </a>

          <a href="#" aria-label="Facebook">
            <i class="fa-brands fa-facebook"></i>
          </a>

          <a href="#" aria-label="X">
            <i class="fa-brands fa-x-twitter"></i>
          </a>

          <a href="#" aria-label="YouTube">
            <i class="fa-brands fa-youtube"></i>
          </a>

        </div>

        <!-- IMPROVEMENT: Use anchors styled as buttons.
             Don't put <a> inside <button>. -->
        <div class="actions">

          <a href="#" class="profile-btn">Subscribe</a>

          <a href="#" class="profile-btn">Message</a>

        </div>

        <!-- Statistics section -->
        <div class="stats">

          <div class="stat">
            <span>60K</span>
            <i class="fa-solid fa-heart"></i>
          </div>

          <div class="stat">
            <span>34K</span>
            <i class="fa-brands fa-rocketchat"></i>
          </div>

          <div class="stat">
            <span>72K</span>
            <i class="fa-solid fa-circle-arrow-right"></i>
          </div>

        </div>

      </div>

    </div>

  </main>

</body>
</html>
